<style>

body {
  margin: 0;
  font-family: "Noto Sans JP", sans-serif;
  background: #0a0f1a;
  color: #e6edf3;
}

/* 入室アニメーション */
#intro {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: 9999;
}

.panel {
  position: absolute;
  width: 100%;
  height: 50%;
  background: #020617;
  transition: transform 1s ease;
}

.top {
  top: 0;
}

.bottom {
  bottom: 0;
}

#intro.open .top {
  transform: translateY(-100%);
}

#intro.open .bottom {
  transform: translateY(100%);
}

/* ヘッダー */
header {
  display: flex;
  justify-content: space-between;
  padding: 16px 40px;
  background: #020617;
  border-bottom: 1px solid #1f2937;
}

nav a {
  margin-left: 20px;
  color: #94a3b8;
  text-decoration: none;
  font-size: 13px;
}

/* ヒーロー */
.hero {
  padding: 100px 20px;
  text-align: center;
}

.hero h2 {
  font-size: 34px;
  font-weight: 400;
}

/* セクション */
.section {
  padding: 60px 20px;
  border-top: 1px solid #1f2937;
}

.container {
  max-width: 800px;
  margin: auto;
}

.card {
  background: #020617;
  border: 1px solid #1f2937;
  padding: 28px;
  border-radius: 8px;
  transition: transform 0.3s ease;
}

.card:hover {
  transform: translateY(-4px);
}

/* フェードイン */
.fade {
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s ease;
}

.fade.show {
  opacity: 1;
  transform: translateY(0);
}

/* 動画 */
iframe {
  width: 100%;
  height: 315px;
  margin-top: 20px;
  border: none;
}

/* フッター */
footer {
  text-align: center;
  padding: 20px;
  color: #6b7280;
  font-size: 12px;
}

/* スマホ対応 */
@media (max-width: 768px) {
  header {
    flex-direction: column;
    gap: 10px;
  }

  .hero {
    padding: 60px 10px;
  }

  .hero h2 {
    font-size: 22px;
  }

  iframe {
    height: 200px;
  }
}

</style>
